<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Alessandra & Damiano · Una sorpresa per te</title>
  
  <meta name="description" content="Abbiamo una cosa da dirvi... Apri la busta di Alessandra e Damiano e scopri il messaggio che abbiamo preparato per te.">
  <meta name="theme-color" content="#f1e6df">
  <link rel="preload" as="image" href="assets/coppia-sfondo.jpg">
  
  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Alessandra & Damiano · Una sorpresa per te">
  <meta property="og:description" content="Abbiamo una cosa da dirvi... Una busta, un messaggio speciale. La sorpresa ti aspetta.">
  <meta property="og:image" content="assets/coppia-sfondo.jpg">
  
  <!-- Favicon icon (Sicilian lemon SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍋</text></svg>">
  
  <!-- Google Fonts: Cormorant Garamond (Editorial luxury serif), Alex Brush (Romantic Script), Montserrat (Modern geometric sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css?v=mobile-layout-20261002-3">
</head>
<body>
  <!-- The full portrait sits behind a light veil and fades into the page. -->
  <div class="ambient-background" aria-hidden="true">
    <img class="background-portrait" src="assets/coppia-sfondo.jpg" width="768" height="1024" alt="" fetchpriority="high" decoding="async">
  </div>

  <!-- Particle / Floating Petals Canvas -->
  <canvas id="petals-canvas" aria-hidden="true"></canvas>

  <!-- Header Note -->
  <header class="top-bar">
    <span class="header-note"></span>
  </header>

  <!-- Main Experience Stage -->
  <main class="experience-stage">
    <section class="couple-story" aria-label="Alessandra e Damiano">
      <p class="couple-names">Alessandra <span>&amp;</span> Damiano</p>
    </section>

    <section class="invitation-experience" aria-label="Apri il nostro annuncio">
    <!-- Stage Header: Intro text when unopened -->
    <div class="intro-headline" id="intro-headline">
      <p class="intro-eyebrow"><span aria-hidden="true"></span> Un messaggio per te <span aria-hidden="true"></span></p>
      <h1 class="intro-title">
        <span class="intro-lead">Abbiamo una cosa</span>
        <span class="intro-sub">da dirvi.</span>
      </h1>
      <div class="gesture-hint" id="gesture-hint">
        <span class="hint-icon-wrap" aria-hidden="true">
          <svg class="hint-arrow" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20V4M6 10l6-6 6 6"/></svg>
        </span>
        <span class="hint-text">Tocca il sigillo o trascinalo verso l’alto</span>
        <span class="sr-only">Con la tastiera, premi Invio o Spazio per aprire, oppure usa ripetutamente Freccia su per sollevare il sigillo. Freccia giù o Home lo riportano in posizione.</span>
      </div>
    </div>

    <!-- 3D Envelope Container with interactive drag/swipe handlers -->
    <div class="envelope-scene" id="envelope-scene">
      <div class="envelope-container" id="envelope-container" aria-label="Busta con un messaggio speciale">
        
        <!-- Envelope 3D Body -->
        <div class="envelope" id="envelope">
          
          <!-- Back Wall with a Single-Colour Paper Lining -->
          <div class="envelope-back">
            <div class="paper-lining" aria-hidden="true"></div>
            <div class="lining-gold-border" aria-hidden="true"></div>
          </div>

          <!-- The Invitation Card (Starts inside the pocket, extracts on swipe) -->
          <div class="invitation-card" id="invitation-card" role="button" tabindex="-1" aria-hidden="true" aria-label="Ingrandisci la cartolina di Alessandra e Damiano">
            <div class="card-inner" id="card-inner">
              <div class="card-glow" aria-hidden="true"></div>
              
              <!-- Card Image Content -->
              <div class="card-image-wrapper">
                <img 
                  id="invitation-img" 
                  src="assets/invito.jpg" 
                  alt="Una sorpresa di Alessandra e Damiano"
                  loading="eager"
                  decoding="async" width="682" height="1024" draggable="false"
                />
              </div>

              <!-- Interactive Gold Foil Ribbon Border -->
              <div class="card-foil-border" aria-hidden="true"></div>
            </div>
          </div>

          <!-- Envelope Pocket Front Layer (covers lower half of card) -->
          <div class="envelope-pocket">
            <div class="pocket-base"></div>
            <div class="pocket-left-flap"></div>
            <div class="pocket-right-flap"></div>
            <div class="pocket-bottom-flap">
              <!-- Golden Monogram crest on bottom flap -->
              <div class="envelope-crest" aria-hidden="true">
                <svg viewBox="0 0 100 60" width="70" height="42" fill="none">
                  <path d="M10 30 Q 50 10 90 30" stroke="#d4af37" stroke-width="1.2" opacity="0.6"/>
                  <path d="M25 35 Q 50 18 75 35" stroke="#d4af37" stroke-width="0.8" opacity="0.4"/>
                  <circle cx="50" cy="22" r="3" fill="#d4af37" opacity="0.8"/>
                </svg>
              </div>
            </div>
          </div>

          <!-- Envelope Top Flap (Opens upwards with 3D fold) -->
          <div class="envelope-top-flap" id="envelope-top-flap">
            <div class="top-flap-outer">
              <div class="top-flap-triangle"></div>
            </div>
            <div class="top-flap-inner">
              <div class="top-flap-lining"></div>
            </div>
          </div>

            <!-- Authentic Wax Seal (Ceralacca) with Embossed Monogram -->
            <div class="wax-seal" id="wax-seal" role="button" tabindex="0" title="Tocca o trascina il sigillo verso l’alto" aria-label="Apri la busta" aria-describedby="gesture-hint" aria-keyshortcuts="Enter Space ArrowUp ArrowDown Home">
              <!-- Concentric Radiating Glow Waves -->
              <div class="seal-glow-radiant" aria-hidden="true">
                <span class="seal-glow-wave wave-1"></span>
                <span class="seal-glow-wave wave-2"></span>
                <span class="seal-glow-wave wave-3"></span>
                <span class="seal-glow-wave wave-4"></span>
              </div>
              <div class="seal-core-glow" aria-hidden="true"></div>
              
              <div class="seal-body">
                <div class="seal-rim"></div>
                <div class="seal-emblem">
                  <svg viewBox="0 0 100 100" class="seal-svg" aria-hidden="true">
                    <!-- Olive / Lemon branch wreath -->
                    <circle cx="50" cy="50" r="42" stroke="rgba(255,225,160,0.5)" stroke-width="2" fill="none" stroke-dasharray="3 3"/>
                    <!-- Monogram text -->
                    <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="32" fill="#ffd885" filter="drop-shadow(1px 2px 1px rgba(0,0,0,0.5))">A&amp;D</text>
                  </svg>
                </div>
              </div>
            </div>

        </div> <!-- /.envelope -->

        <!-- Envelope Ambient Drop Shadow on Table -->
        <div class="envelope-shadow" aria-hidden="true"></div>

      </div> <!-- /.envelope-container -->
    </div> <!-- /.envelope-scene -->

    <!-- Post-Extraction Action & Celebratory Panel (Revealed when card is out) -->
    <div class="celebration-panel" id="celebration-panel" aria-live="polite" aria-hidden="true" inert>
      
      <!-- Action Buttons Grid -->
      <div class="actions-grid">
        
        <!-- Primary Action: Save The Date to Calendar -->
        <div class="calendar-action-wrapper">
          <button id="add-calendar-btn" class="calendar-button" aria-haspopup="menu" aria-expanded="false" aria-controls="calendar-dropdown">
            <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
              <circle cx="12" cy="15" r="1.5" fill="currentColor"></circle>
            </svg>
            <span>Aggiungi al calendario</span>
            <svg class="btn-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <!-- Calendar Options Popover Dropdown -->
          <div class="calendar-dropdown" id="calendar-dropdown" role="menu" aria-hidden="true" inert>
            <button class="dropdown-item" id="cal-google" role="menuitem">
              <span class="dropdown-icon">📅</span>
              <div class="dropdown-text">
                <strong>Google Calendar</strong>
                <small>Aggiungi a Google Calendar</small>
              </div>
            </button>
            <button class="dropdown-item" id="cal-apple-ics" role="menuitem">
              <span class="dropdown-icon">🍏</span>
              <div class="dropdown-text">
                <strong>Apple Calendar / iCal (.ics)</strong>
                <small>Per iPhone, iPad e Mac</small>
              </div>
            </button>
            <button class="dropdown-item" id="cal-outlook" role="menuitem">
              <span class="dropdown-icon">📧</span>
              <div class="dropdown-text">
                <strong>Outlook / Altri calendari</strong>
                <small>Scarica promemoria universale</small>
              </div>
            </button>
          </div>
        </div>

      </div> <!-- /.actions-grid -->

    </div> <!-- /.celebration-panel -->
    </section>

  </main>

  <!-- Lightbox Modal for Fullscreen View of the Card -->
  <div class="lightbox-modal" id="lightbox-modal" role="dialog" aria-modal="true" aria-label="Visualizzazione a schermo intero" aria-hidden="true" inert>
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <button class="lightbox-back" id="lightbox-close" aria-label="Torna all’annuncio">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"></path>
      </svg>
      <span>Indietro</span>
    </button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="assets/invito.jpg" alt="Alessandra e Damiano si sposano il 4 giugno 2027 in Sicilia. L’invito ufficiale arriverà presto con tutti i dettagli." />
    </div>
  </div>

  <!-- Toast Notification Message -->
  <div class="toast-notification" id="toast-notification" role="status" aria-live="polite"></div>

  <!-- Confetti Canvas for Celebratory sbustamento burst -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- JavaScript Code -->
  <script src="app.js?v=mobile-layout-20261002-2"></script>
</body>
</html>
